<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Synchronized Lyrics</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: rgba(30,30,30,0.97);
      color: #fff;
      font-family: sans-serif;
      border-radius: 24px;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 32px rgba(0,0,0,0.2);
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }
    #lyrics {
      flex: 1;
      width: 90%;
      margin: 20px 0 10px 0;
      overflow-y: auto;
      font-size: 1.1em;
      line-height: 1.6em;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-app-region: no-drag;
      cursor: grab;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    #lyrics::-webkit-scrollbar {
      display: none;
    }
    #syncBtn {
      position: absolute;
      top: 10px;
      right: 16px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 18px;
      z-index: 10;
      -webkit-app-region: drag;
      transition: background 0.2s;
      display: none;
    }
    #syncBtn.active { display: inline; }
    #syncBtn:active {
      background: rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <button id="syncBtn" title="Reactivate synchronization">🔄</button>
  <div id="lyrics">Loading...</div>
  <script src="lyrics.js"></script>
</body>
</html>
