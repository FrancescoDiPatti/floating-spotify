<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=350, initial-scale=1.0">
  <title></title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
    }
    #main {
      -webkit-app-region: drag;
      width: 100vw;
      height: 100vw;
      min-width: 150px;
      min-height: 150px;
      max-width: 100vw;
      max-height: 100vw;
      aspect-ratio: 1 / 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #cover {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 32px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.2);
      object-fit: cover;
      transition: box-shadow 0.2s, border-radius 0.2s;
      pointer-events: none;
      user-select: none;
    }
    #blurOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(12px);
      background: rgba(30,30,30,0.25);
      z-index: 1;
      pointer-events: none;
      transition: opacity 0.3s;
      opacity: 0;
    }
    #controls {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: row;
      gap: 8px;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.2s;
      -webkit-app-region: no-drag;
    }
    #main:hover #controls {
      opacity: 1;
    }
    .btn {
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 16px;
      -webkit-app-region: no-drag;
      outline: none;
      transition: background 0.2s;
    }
    .btn:active {
      background: rgba(0,0,0,0.8);
    }
  </style>
</head>
<body style="background: transparent; margin: 0; padding: 0;">
  <div id="main" style="width:100%;height:100%;position:relative;">
    <img id="cover" src="https://placehold.co/350x350?text=Spotify" alt="cover" />
    <div id="blurOverlay"></div>
    <div id="controls">
      <button class="btn" id="settingsBtn">⚙️</button>
      <button class="btn" id="lyricsBtn">🎤</button>
      <button class="btn" id="closeBtn">✖️</button>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
