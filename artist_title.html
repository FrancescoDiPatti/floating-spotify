<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title></title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: rgba(30,30,30,0.95);
      color: #fff;
      border-radius: 24px;
      font-family: sans-serif;
      width: 260px;
      height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 32px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    #title {
      font-size: 1.1em;
      font-weight: bold;
      text-align: center;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 90%;
    }
    #artist {
      font-size: 0.95em;
      color: #aaa;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 90%;
    }
  </style>
</head>
<body style="background: transparent; margin: 0; padding: 0;">
  <div id="title">Title</div>
  <div id="artist">Artist</div>
  <script src="artist_title.js"></script>
</body>
</html>
